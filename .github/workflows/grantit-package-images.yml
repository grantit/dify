# Grantit-owned image packaging. Builds and pushes only the Dify API and web
# images to GHCR. It does not deploy, and it does not run on main or
# grantit/1.20.0.
name: Grantit package images

on:
  push:
    branches:
      - feat/agent-v2-mcp-identity-bindings
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: grantit-package-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.image_name }}
    if: github.ref == 'refs/heads/feat/agent-v2-mcp-identity-bindings'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: dify-api
            dockerfile: api/Dockerfile
          - image_name: dify-web
            dockerfile: web/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve branch tag
        id: tags
        run: |
          branch_tag="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          echo "branch=${branch_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/grantit/${{ matrix.image_name }}:sha-${{ github.sha }}
            ghcr.io/grantit/${{ matrix.image_name }}:${{ steps.tags.outputs.branch }}
            ghcr.io/grantit/${{ matrix.image_name }}:1.20.0-grantit
